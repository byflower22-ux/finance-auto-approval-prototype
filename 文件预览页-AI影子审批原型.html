<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>文件预览｜AI 审批原型</title>
  <style>
    :root{--nav:#303d5b;--red:#f26b6b;--ink:#303846;--muted:#8793a5;--line:#e8edf3;--page:#f5f7fa;--blue:#2864ee}
    *{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--page);font:14px/1.45 "Microsoft YaHei","PingFang SC",Arial,sans-serif}
    .topbar{position:fixed;z-index:3;top:0;right:0;left:196px;height:36px;padding:0 18px;display:flex;align-items:center;justify-content:flex-end;background:#fff;border-bottom:1px solid var(--line);color:#718096;font-size:12px}
    .brand{position:fixed;z-index:4;top:0;left:0;width:196px;height:36px;display:flex;align-items:center;gap:7px;padding:0 16px;color:#fff;background:#27334f;font-weight:700}.brand-mark{color:var(--red);font-size:18px}
    .sidebar{position:fixed;top:36px;bottom:0;left:0;width:196px;padding:8px 0;background:var(--nav);color:#cbd4e3}.side-title{padding:9px 16px;color:#fff;font-weight:700}.nav-item{padding:10px 38px;font-size:13px}.nav-item.current{color:#ff7b7b;background:rgba(255,255,255,.07)}
    .workspace{min-height:100vh;margin:36px 0 0 196px}.crumb{height:32px;padding:0 14px;display:flex;align-items:center;background:#fff;border-bottom:1px solid var(--line);color:#718096}.content{max-width:1180px;padding:18px 24px 44px}.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.page-head h1{margin:0;font-size:20px;color:#263854}.back{padding:7px 13px;color:#53627a;background:#fff;border:1px solid #d9e2ec;border-radius:4px;text-decoration:none}.summary,.file-card{margin-bottom:14px;background:#fff;border:1px solid var(--line);border-radius:7px}.summary{display:flex;gap:30px;padding:14px 17px;color:#6f7e93}.summary strong{color:#34445e}.file-card h2{margin:0;padding:13px 16px;border-bottom:1px solid var(--line);font-size:14px}.file-list{padding:4px 16px}.file-row{display:grid;grid-template-columns:34px 1fr 150px 90px;gap:12px;align-items:center;min-height:62px;border-bottom:1px solid #f0f2f5}.file-row:last-child{border-bottom:0}.file-icon{display:grid;place-items:center;width:28px;height:28px;color:#df5650;background:#fff0ee;border-radius:5px;font-size:10px;font-weight:700}.file-name strong{display:block;color:#40506a}.file-name small{display:block;margin-top:3px;color:var(--muted);font-size:11px}.file-meta{color:var(--muted);font-size:12px}.preview-btn{justify-self:end;padding:5px 10px;color:var(--blue);background:#f5f8ff;border:1px solid #dce6fa;border-radius:4px;cursor:pointer}.empty{padding:30px;color:#9aa4b2;text-align:center}
  </style>
</head>
<body>
  <div class="brand"><span class="brand-mark">✥</span><span>博商管理</span></div><div class="topbar">财务管理　/　审批确认　/　文件预览</div>
  <aside class="sidebar"><div class="side-title">财务管理</div><div class="nav-item current">文件预览</div><div class="nav-item">审批确认</div><div class="nav-item">AI审单记录</div></aside>
  <main class="workspace"><div class="crumb">审批确认　›　文件预览</div><div class="content"><div class="page-head"><h1>文件预览</h1><a class="back" id="backToApproval" href="财务审批页-AI影子审单原型.html">返回审批详情</a></div><section class="summary"><span>单号：<strong id="documentNo">--</strong></span><span>单据类型：<strong id="documentType">付款申请</strong></span><span>查看关联发票及附件</span></section><section class="file-card"><h2>发票文件</h2><div class="file-list"><div class="file-row"><span class="file-icon">PDF</span><div class="file-name"><strong>044032600201_电子发票.pdf</strong><small>深圳同鹏餐饮管理有限公司 · 2026-07-29</small></div><span class="file-meta">发票影像</span><button class="preview-btn" type="button">预览</button></div></div></section><section class="file-card"><h2>附件文件</h2><div class="file-list"><div class="file-row"><span class="file-icon">PDF</span><div class="file-name"><strong>差旅行程单.pdf</strong><small>费用明细：差旅－交通</small></div><span class="file-meta">业务材料</span><button class="preview-btn" type="button">预览</button></div><div class="file-row"><span class="file-icon">PDF</span><div class="file-name"><strong>住宿发票附件.pdf</strong><small>费用明细：差旅－住宿</small></div><span class="file-meta">业务材料</span><button class="preview-btn" type="button">预览</button></div></div></section></div></main>
  <script>
    (()=>{const params=new URLSearchParams(location.search);const no=params.get('documentNo')||'PAY-20260805-0086';document.getElementById('documentNo').textContent=no;document.getElementById('documentType').textContent=params.get('documentType')==='reimbursement'?'报销申请':'付款申请';const back=new URL('财务审批页-AI影子审单原型.html',location.href);back.search=new URLSearchParams({from:'file-preview',documentType:params.get('documentType')||'payment',approvalKind:params.get('approvalKind')||'project',documentNo:no,aiStatus:params.get('aiStatus')||'',aiSuggestion:params.get('aiSuggestion')||''});document.getElementById('backToApproval').href=back.href;document.querySelectorAll('.preview-btn').forEach(button=>button.addEventListener('click',()=>alert('原型演示：已打开文件预览。')));})();
  </script>
</body>
</html>
