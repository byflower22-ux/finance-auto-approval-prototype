<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>申请中心｜付款报销原型</title>
  <style>
    :root { --nav:#263856; --nav-hover:#364b70; --blue:#2864ee; --ink:#1f2d43; --muted:#76869d; --line:#e6ebf2; --page:#f5f7fb; --red:#f15b61; --orange:#ff9e32; --cyan:#49a8ea; --purple:#8676e8; }
    * { box-sizing:border-box; } body { min-width:1180px; margin:0; color:var(--ink); background:var(--page); font:14px/1.45 "Microsoft YaHei","PingFang SC",Arial,sans-serif; }
    .topbar { position:fixed; z-index:10; top:0; right:0; left:0; display:flex; align-items:center; justify-content:space-between; height:62px; padding:0 25px 0 21px; background:#fff; border-bottom:1px solid var(--line); }
    .brand { display:flex; align-items:center; gap:11px; color:#34455e; font-size:19px; font-weight:700; } .menu-icon { margin-right:7px; color:#1c2738; font-size:23px; } .brand-mark { display:grid; width:27px; height:27px; place-items:center; color:#fff; background:#e7525c; border-radius:7px 12px 7px 12px; transform:rotate(45deg); } .brand-mark span { transform:rotate(-45deg); font-size:13px; }
    .top-actions { display:flex; align-items:center; gap:25px; color:#65748b; font-size:13px; } .top-actions b { color:#2d72e8; font-size:15px; } .user { display:flex; align-items:center; gap:8px; color:#536177; } .avatar { display:grid; width:29px; height:29px; place-items:center; color:#fff; background:#d95156; border-radius:50%; font-size:12px; }
    .sidebar { position:fixed; z-index:5; top:62px; bottom:0; left:0; width:204px; padding:15px 12px; color:#cbd5e7; background:var(--nav); overflow:auto; } .side-title { display:flex; align-items:center; justify-content:space-between; padding:5px 11px 13px; color:#fff; font-size:13px; font-weight:700; } .nav-item { display:flex; align-items:center; gap:10px; min-height:38px; padding:0 12px; color:#cbd5e7; border-radius:6px; font-size:13px; } .nav-item.active { color:#fff; background:var(--nav-hover); font-weight:700; } .nav-sub { margin:3px 0 4px 37px; padding:7px 0; color:#9db6e6; font-size:13px; } .nav-sub.current { color:#ff7478; font-weight:700; }
    .workspace { min-height:calc(100vh - 62px); margin:62px 0 0 204px; } .tabs { display:flex; align-items:end; gap:6px; height:47px; padding:0 27px; background:#fff; border-bottom:1px solid var(--line); } .tab { padding:10px 18px; color:#43689d; background:#f8faff; border:1px solid #e0e6ee; border-bottom:0; border-radius:4px 4px 0 0; font-size:13px; } .tab.active { color:#34455f; background:#fff; font-weight:700; }
    .content { padding:22px 27px 55px; } .crumb { color:#7d8aa0; font-size:12px; } .crumb strong { color:#39485e; } .page-head { display:flex; align-items:center; justify-content:space-between; margin:14px 0 18px; } .page-head h1 { margin:0; color:#263752; font-size:21px; } .page-head p { margin:4px 0 0; color:#8794a6; font-size:12px; } .tips { padding:7px 10px; color:#3c73c8; background:#eef5ff; border:1px solid #d9e8ff; border-radius:99px; font-size:11px; }
    .panel { min-height:600px; padding:21px 26px; background:#fff; border:1px solid var(--line); border-radius:6px; box-shadow:0 5px 18px rgba(25,48,85,.04); } .section-title { margin:0 0 20px; color:#2c3a51; font-size:16px; } .apps { display:grid; grid-template-columns:repeat(9, minmax(102px,1fr)); gap:30px 22px; margin-bottom:58px; } .app { display:flex; flex-direction:column; align-items:center; gap:10px; min-height:105px; padding:8px 3px; color:#273750; border:0; background:transparent; border-radius:7px; font:inherit; font-weight:700; text-align:center; } .app:not(.disabled) { cursor:pointer; } .app:not(.disabled):hover { color:var(--blue); background:#f2f7ff; } .app-icon { display:grid; width:42px; height:42px; place-items:center; border-radius:10px; color:#fff; box-shadow:0 4px 10px rgba(38,76,137,.14); font-size:21px; } .red { background:var(--red); } .orange { background:var(--orange); } .cyan { background:var(--cyan); } .purple { background:var(--purple); } .blue { background:#4f8eea; } .green { background:#4dbb96; } .app small { color:#9aa6b7; font-weight:400; } .app.payment .app-icon { background:#f79c20; } .app.payment::after { content:'首期已接入'; margin-top:-6px; padding:2px 6px; color:#c66c00; background:#fff4df; border-radius:99px; font-size:10px; font-weight:400; }
    .line { height:1px; margin:-20px 0 32px; background:#eef2f6; } .prototype-nav-link { cursor:pointer; } .prototype-nav-link:focus-visible { outline:2px solid #8cb2ff; outline-offset:-2px; }
    .tabs .tab { cursor:pointer; } .tabs button.tab { font:inherit; cursor:pointer; } .tab-close { display:inline-grid; width:16px; height:16px; margin-left:5px; place-items:center; color:#718099; border-radius:3px; font-size:15px; line-height:1; vertical-align:-1px; } .tab-close:hover { color:#fff; background:#7b8ba4; }
  </style>
</head>
<body>
  <header class="topbar"><div class="brand"><span class="menu-icon">☰</span><span class="brand-mark"><span>博</span></span>博商管理</div><div class="top-actions"><b>▦ 应用中心⌄</b><span>▣ 帮助手册</span><span>▣ 日程</span><span>✦ 模块</span><span class="user"><i class="avatar">管</i>超级管理员⌄</span></div></header>
  <aside class="sidebar"><div class="side-title"><span>⌂ 办公管理</span><span>⌄</span></div><div class="nav-item active">▣ 申请</div><div class="nav-sub current">申请中心</div><div class="nav-item">▥ 审批</div><div class="nav-sub">我的申请</div><div class="nav-sub">我的待办</div><div class="nav-item">⌘ 流程</div><div class="nav-item">▦ 记录</div><div class="nav-item">● 日程</div><div class="nav-item">◆ 项目计划</div><div class="nav-item">✦ 同学会</div><div class="nav-item">◉ 研企管理</div><div class="nav-item">◈ 智服系统</div><div class="nav-item">▤ 证书管理</div><div class="nav-item">▦ 智能报表</div><div class="nav-item">◌ 统计分析</div></aside>
  <main class="workspace"><div class="tabs"><button class="tab" type="button" data-workspace-tab="home">首页</button><button class="tab" type="button" data-workspace-tab="role-list">角色列表 ×</button><button class="tab active" type="button" data-workspace-tab="apply-center">申请<span class="tab-close" data-close-workspace-tab="apply-center" role="button" aria-label="关闭申请页签">×</span></button></div><div class="content"><div class="crumb">办公管理　/　<strong>申请</strong></div><div class="page-head"><div><h1>申请中心</h1><p>选择单据类型后发起申请；付款单已接入本次 AI 审单优化流程。</p></div><span class="tips">● 付款单为本期演示入口</span></div><section class="panel"><h2 class="section-title">部门常用类</h2><div class="apps"><button class="app disabled" type="button"><span class="app-icon red">▣</span>出差报销单</button><button class="app disabled" type="button"><span class="app-icon red">▤</span>报销/项目报销单</button><button class="app disabled" type="button"><span class="app-icon cyan">¥</span>经营分析规则调整单</button><button class="app disabled" type="button"><span class="app-icon orange">¥</span>调整预算单</button><button class="app disabled" type="button"><span class="app-icon orange">▤</span>特批单</button><button class="app payment" type="button" data-application="payment-form"><span class="app-icon">▤</span>付款/项目付款单<small>发起付款 / 项目付款</small></button><button class="app disabled" type="button"><span class="app-icon orange">¥</span>借款单</button><button class="app disabled" type="button"><span class="app-icon red">✈</span>出差单</button><button class="app disabled" type="button"><span class="app-icon cyan">▥</span>内部调账单</button><button class="app disabled" type="button"><span class="app-icon purple">♟</span>换人就读单</button><button class="app disabled" type="button"><span class="app-icon red">▤</span>入企报销单</button><button class="app disabled" type="button"><span class="app-icon cyan">▣</span>固定资产付款单</button><button class="app disabled" type="button"><span class="app-icon cyan">▣</span>固定资产报销单</button><button class="app disabled" type="button"><span class="app-icon blue">♟</span>offer审批单</button><button class="app disabled" type="button"><span class="app-icon blue">♟</span>撞单申诉单</button><button class="app disabled" type="button"><span class="app-icon blue">♟</span>付款申请书</button></div><div class="line"></div><h2 class="section-title">教学中心</h2><div class="apps"><button class="app disabled" type="button"><span class="app-icon blue">✦</span>取消签到申请单</button><button class="app disabled" type="button"><span class="app-icon red">✈</span>禁止复训申请单</button><button class="app disabled" type="button"><span class="app-icon red">✈</span>恢复复训申请单</button></div></section></div></main>
  <script>
    (() => {
      const tabs = document.querySelector('.tabs');
      const content = document.querySelector('.workspace > .content');
      if (!tabs || !content) return;
      [...document.querySelectorAll('.app.disabled')].find(button => /报销\/项目报销单|报销申请/.test(button.textContent.trim()))?.remove();
      tabs.children[1]?.remove();
      document.querySelector('.page-head > div')?.remove();
      const paymentTabId = 'payment-form';
      const paymentPage = '报销申请页-AI审单优化原型.html';
      const reimbursementTabId = 'reimbursement-form';
      const reimbursementPage = '报销申请页-AI审单优化原型.html?documentType=reimbursement';
      const applicationTab = tabs.lastElementChild;
      tabs.insertAdjacentHTML('beforeend', '<button class="tab" type="button" data-workspace-tab="office-approval" data-workspace-route="审批列表原型.html">审批<span class="tab-close" data-close-workspace-tab="office-approval" role="button" aria-label="关闭审批页签">×</span></button><button class="tab" type="button" data-workspace-tab="finance-todo" data-workspace-route="财务待办页-AI影子审批原型.html">审批确认<span class="tab-close" data-close-workspace-tab="finance-todo" role="button" aria-label="关闭审批确认页签">×</span></button>');
      applicationTab.dataset.workspaceTab = 'apply-center';
      const reimbursementEntry = document.createElement('button');
      reimbursementEntry.className = 'app reimbursement';
      reimbursementEntry.type = 'button';
      reimbursementEntry.dataset.application = reimbursementTabId;
      reimbursementEntry.innerHTML = '<span class="app-icon red">▤</span>报销申请<small>发起报销 / 项目报销</small>';
      document.querySelector('.apps')?.insertBefore(reimbursementEntry, document.querySelector('.apps')?.children[1] || null);
      const paymentEntry = document.querySelector('[data-application="payment-form"]');
      if (paymentEntry) paymentEntry.innerHTML = '<span class="app-icon">▤</span>付款申请<small>发起付款 / 项目付款</small>';

      function activateWorkspaceTab(tabId) {
        tabs.querySelectorAll('[data-workspace-tab]').forEach(tab => tab.classList.toggle('active', tab.dataset.workspaceTab === tabId));
      }

      function openPaymentApplication() {
        window.location.href = paymentPage;
      }

      function openReimbursementApplication() {
        window.location.href = reimbursementPage;
      }

      tabs.addEventListener('click', event => {
        const close = event.target.closest('[data-close-workspace-tab]');
        if (close) {
          event.stopPropagation();
          const closingTab = close.closest('[data-workspace-tab]');
          const closingId = closingTab.dataset.workspaceTab;
          closingTab.remove();
          activateWorkspaceTab(closingId === 'apply-center' ? 'home' : 'apply-center');
          return;
        }
        const tab = event.target.closest('[data-workspace-tab]');
        if (tab?.dataset.workspaceRoute) { window.location.href=tab.dataset.workspaceRoute; return; }
        if (tab) activateWorkspaceTab(tab.dataset.workspaceTab);
      });

      document.addEventListener('click', event => {
        const application = event.target.closest('[data-application]')?.dataset.application;
        if (!application) return;
        event.preventDefault();
        event.stopImmediatePropagation();
        if (application === reimbursementTabId) openReimbursementApplication();
        else if (application === paymentTabId) openPaymentApplication();
      }, true);
      window.openPaymentApplication = openPaymentApplication;
      window.openReimbursementApplication = openReimbursementApplication;
    })();
  </script>
  <script src="prototype-navigation.js"></script>
</body>
</html>
